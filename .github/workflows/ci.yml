name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Architecture guards
        run: pnpm check:architecture && pnpm test:guards

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (agence)
        run: pnpm exec playwright test -c apps/desktop/playwright.config.ts apps/desktop/tests/unit/agence-
